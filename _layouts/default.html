<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} · {% endif %}Saipranav Venkatakrishnan</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <meta name="author" content="{{ site.author }}" />

  <!-- Open Graph -->
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}Saipranav Venkatakrishnan" />
  <meta property="og:description" content="{{ page.description | default: site.description }}" />
  <meta property="og:type" content="website" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="{{ '/images/website_icon.jpg' | relative_url }}" />

  <!-- GoatCounter analytics -->
  <script data-goatcounter="https://sai-pra.goatcounter.com/count"
          async src="https://gc.zgo.at/count.js"></script>
  <noscript><img src="https://sai-pra.goatcounter.com/count?p={{ page.url | url_encode }}" alt="" referrerpolicy="unsafe-url" /></noscript>

  {% seo %}
  {% feed_meta %}
</head>
<body>
  <!-- Prevent flash of wrong theme -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var preferred = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', saved || preferred);
    })();
  </script>

  <div class="container">

    <nav class="site-nav">
      <div class="nav-links">
        <a href="{{ '/' | relative_url }}">about</a>
        <a href="{{ '/#experience' | relative_url }}">experience</a>
        <a href="{{ '/blog/' | relative_url }}">blog</a>
        <a href="mailto:{{ site.email }}">contact</a>
        <a href="/resume/Saipranav_Venkatakrishnan_Resume.pdf" target="_blank">resume</a>
      </div>
      <button class="theme-toggle" id="theme-toggle" aria-label="toggle color theme">light</button>
    </nav>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      <span class="copyright">© 2026 saipranav venkatakrishnan</span>
      <span class="visitor-count">
        visitors: <span id="gc-count">…</span>
        &nbsp;·&nbsp;
        <a href="https://sai-pra.goatcounter.com" target="_blank" rel="noopener">stats →</a>
      </span>
    </footer>

  </div>

  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
</body>
</html>
